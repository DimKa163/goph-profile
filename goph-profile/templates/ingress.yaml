{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-ingress
  namespace: {{ .Chart.Name }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end}}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote}}
      http:
        paths:
          {{- range .paths}}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  number: {{ .port }}

          {{- end }}

    {{- end }}
{{- end }}