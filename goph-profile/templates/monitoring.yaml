apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: {{ .Values.monitoring.namespace }}
data:
  grafana-datasources.yml: |
    # nonk8s
    apiVersion: 1

    datasources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: true
      editable: true
      jsonData:
      maxLines: 1000
    
    - name: Prometheus
      type: prometheus
      uid: dfs9enowgtl34a
      access: proxy
      url: http://prometheus:9090
      isDefault: false
      editable: true
    
    - name: Jaeger
      type: jaeger
      access: proxy
      url: http://jaeger:16686
      editable: true
---
