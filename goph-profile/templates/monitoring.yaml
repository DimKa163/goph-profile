apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.monitoring.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.monitoring.namespace }}
data:
  alerts.yml: |
    groups:
      - name: avatar-service
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate(avatars_uploads_total{status="failure"}[5m]))
              /
              sum(rate(avatars_uploads_total[5m]))
              > 0.1
            for: 5m
            labels:
              severity: warning

          - alert: HighResponseTime
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(avatars_upload_duration_seconds_bucket[5m])
                )
              ) > 5
            for: 2m
            labels:
              severity: critical
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/alerts/*.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: [ 'prometheus:9090' ]

      - job_name: 'node'
        static_configs:
          - targets: [ 'node-exporter:9100' ]

      - job_name: 'otel-collector'
        static_configs:
          - targets: [ 'otel-collector:8889' ]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Values.monitoring.namespace }}
data:
  otel-collector-config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024

      resource/add-job:
        attributes:
          - key: job
            from_attribute: service.name
            action: upsert

    exporters:
      otlphttp/loki:
        endpoint: http://loki:3100/otlp
        compression: "gzip"
        tls:
          insecure: true

      prometheus:
        endpoint: '0.0.0.0:8889'

      otlp/traces:
        endpoint: 'jaeger:4317'
        tls:
          insecure: true

    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers: [ otlp ]
          processors:
            - resource/add-job
            - batch
          exporters: [ otlphttp/loki ]

        metrics:
          receivers: [ otlp ]
          processors: [ batch ]
          exporters: [ prometheus ]

        traces:
          receivers: [ otlp ]
          processors: [ batch ]
          exporters: [ otlp/traces ]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Values.monitoring.namespace }}
data:
  loki-config.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info
      grpc_server_max_concurrent_streams: 1000

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    memberlist:
      join_members: [ ]

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    limits_config:
      metric_aggregation_enabled: true
      enable_multi_variant_queries: true

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    pattern_ingester:
      enabled: false

    frontend:
      encoding: protobuf
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.monitoring.deployment.prometheus.serviceName }}
  namespace: {{ .Values.monitoring.namespace }}
spec:
  type: {{ .Values.monitoring.deployment.prometheus.service.type }}
  selector:
    app: {{ .Values.monitoring.deployment.prometheus.serviceName }}
  ports:
    - port: {{ .Values.monitoring.deployment.prometheus.service.port }}
      targetPort: {{ .Values.monitoring.deployment.prometheus.service.targetPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.monitoring.deployment.prometheus.serviceName }}
  namespace: {{ .Values.monitoring.namespace }}

spec:
  replicas: {{ .Values.monitoring.deployment.prometheus.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.monitoring.deployment.prometheus.serviceName }}

  template:
    metadata:
      labels:
        app: {{ .Values.monitoring.deployment.prometheus.serviceName }}

    spec:
      containers:
        - name: {{ .Values.monitoring.deployment.prometheus.serviceName }}
          image: "{{ .Values.monitoring.deployment.prometheus.image.repository }}:{{ .Values.monitoring.deployment.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.deployment.prometheus.image.imagePullPolicy }}

          ports:
            - containerPort: {{ .Values.monitoring.deployment.prometheus.service.port }}

          volumeMounts:
            - mountPath: /etc/prometheus/prometheus.yml
              name: prometheus-config
              subPath: prometheus.yml
            - mountPath: /etc/prometheus/alerts/alerts.yml
              name: prometheus-config
              subPath: alerts.yml

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.monitoring.deployment.otelCollector.serviceName }}
  namespace: {{ .Values.monitoring.namespace }}
spec:
  type: {{ .Values.monitoring.deployment.otelCollector.service.type }}
  selector:
    app: {{ .Values.monitoring.deployment.otelCollector.serviceName }}
  ports:
    - name: {{ .Values.monitoring.deployment.otelCollector.service.ports.otlpGrpc.name | quote }}
      port: {{ .Values.monitoring.deployment.otelCollector.service.ports.otlpGrpc.port }}
      targetPort: {{ .Values.monitoring.deployment.otelCollector.service.ports.otlpGrpc.targetPort }}
    - name: {{ .Values.monitoring.deployment.otelCollector.service.ports.prometheus.name | quote }}
      port: {{ .Values.monitoring.deployment.otelCollector.service.ports.prometheus.port }}
      targetPort: {{ .Values.monitoring.deployment.otelCollector.service.ports.prometheus.targetPort }}
    - name: {{ .Values.monitoring.deployment.otelCollector.service.ports.health.name | quote }}
      port: {{ .Values.monitoring.deployment.otelCollector.service.ports.health.port }}
      targetPort: {{ .Values.monitoring.deployment.otelCollector.service.ports.health.targetPort }}

  {{- if ne .Values.monitoring.deployment.otelCollector.service.type "NodePort" }}
  clusterIP: {{ .Values.monitoring.deployment.otelCollector.service.clusterIP }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.monitoring.deployment.otelCollector.serviceName }}
  namespace: {{ .Values.monitoring.namespace }}

spec:
  replicas: {{ .Values.monitoring.deployment.otelCollector.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.monitoring.deployment.otelCollector.serviceName }}

  template:
    metadata:
      labels:
        app: {{ .Values.monitoring.deployment.otelCollector.serviceName }}

    spec:
      containers:
        - name: {{ .Values.monitoring.deployment.otelCollector.serviceName }}
          image: "{{ .Values.monitoring.deployment.otelCollector.image.repository }}:{{ .Values.monitoring.deployment.otelCollector.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.deployment.otelCollector.image.imagePullPolicy }}

          ports:
            - name: {{ .Values.monitoring.deployment.otelCollector.service.ports.otlpGrpc.name | quote }}
              containerPort: {{ .Values.monitoring.deployment.otelCollector.service.ports.otlpGrpc.port }}
            - name: {{ .Values.monitoring.deployment.otelCollector.service.ports.prometheus.name | quote }}
              containerPort: {{ .Values.monitoring.deployment.otelCollector.service.ports.prometheus.port }}
            - name: {{ .Values.monitoring.deployment.otelCollector.service.ports.health.name | quote }}
              containerPort: {{ .Values.monitoring.deployment.otelCollector.service.ports.health.port }}

          volumeMounts:
            - mountPath: /etc/otel-collector-config.yml
              name: otel-collector-config
              subPath: otel-collector-config.yml

          args:
            - "--config=/etc/otel-collector-config.yml"

      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.monitoring.deployment.loki.serviceName }}
  namespace: {{ .Values.monitoring.namespace }}
spec:
  type: {{ .Values.monitoring.deployment.loki.service.type }}
  selector:
    app: {{ .Values.monitoring.deployment.loki.serviceName }}
  ports:
    - port: {{ .Values.monitoring.deployment.loki.service.port }}
      targetPort: {{ .Values.monitoring.deployment.loki.service.targetPort }}
  {{- if ne .Values.monitoring.deployment.loki.service.type "NodePort" }}
  clusterIP: {{ .Values.monitoring.deployment.loki.service.clusterIP }}
  {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.monitoring.deployment.loki.serviceName }}
  namespace: {{ .Values.monitoring.namespace }}

spec:
  serviceName: {{ .Values.monitoring.deployment.loki.serviceName }}
  replicas: {{ .Values.monitoring.deployment.loki.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.monitoring.deployment.loki.serviceName }}

  template:
    metadata:
      labels:
        app: {{ .Values.monitoring.deployment.loki.serviceName }}

    spec:
      containers:
        - name: {{ .Values.monitoring.deployment.loki.serviceName }}
          image: "{{ .Values.monitoring.deployment.loki.image.repository }}:{{ .Values.monitoring.deployment.loki.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.deployment.loki.image.imagePullPolicy }}

          ports:
            - containerPort: {{ .Values.monitoring.deployment.loki.service.port }}

          volumeMounts:
            - mountPath: /etc/loki/loki-config.yml
              name: loki-config
              subPath: loki-config.yml

            - mountPath: /loki
              name: {{ .Values.monitoring.deployment.loki.serviceName }}-data

          args:
            - "-config.file=/etc/loki/loki-config.yml"

      volumes:
        - name: loki-config
          configMap:
            name: loki-config
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.monitoring.deployment.loki.serviceName }}-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
        {{- toYaml .Values.monitoring.deployment.loki.volumeResources | nindent 10 }}
---
