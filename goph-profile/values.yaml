postgres:
  namespace: "postgres"
  deployment:
    postgres:
      serviceName: "postgres"
      image:
        repository: "postgres"
        tag: "17"
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: NodePort
        clusterIP: None
        port: "5432"
        targetPort: "5432"
      stringData:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: goph
        POSTGRES_DB: goph

      volumeResources:
        requests:
          storage: 1Gi

kafka:
  namespace: kafka
  deployment:
    kafka:
      serviceName: "kafka"
      image:
        repository: "confluentinc/cp-kafka"
        tag: "7.6.1"
        imagePullPolicy: IfNotPresent
      service:
        type: ClusterIP
        clusterIP: None
        port: "9092"
      stringData:
        KAFKA_BROKER_ID: "1"
        KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
        KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
        KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    zookeeper:
      serviceName: "zookeeper"
      image:
        repository: "confluentinc/cp-zookeeper"
        tag: "7.6.1"
        imagePullPolicy: IfNotPresent
      service:
        type: ClusterIP
        clusterIP: None
        port: "2181"

minio:
  namespace: minio
  deployment:
    minio:
      serviceName: minio
      image:
        repository: minio/minio
        tag: latest
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: ClusterIP
        clusterIP: None
        ports:
          api:
            port: "9000"
            targetPort: "9000"
          console:
            port: "9001"
            targetPort: "9001"
      stringData:
        MINIO_ROOT_USER: "admin"
        MINIO_ROOT_PASSWORD: "admin12345"
      resources:
        requests:
          memory: 1Gi
        limits:
          memory: 2Gi
      volumeResources:
        requests:
          storage: 5Gi

monitoring:
  namespace: monitoring
  deployment:
    prometheus:
      serviceName: prometheus
      image:
        repository: prom/prometheus
        tag: v3.13.1
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: NodePort
        port: "9090"
        targetPort: "9090"
    otelCollector:
      serviceName: otel-collector
      image:
        repository: otel/opentelemetry-collector
        tag: 0.143.0
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: ClusterIP
        clusterIP: None
        ports:
          otlpGrpc:
            name: otlp-grpc
            port: "4317"
            targetPort: "4317"
          prometheus:
            name: prometheus
            port: "8889"
            targetPort: "8889"
          health:
            name: health
            port: "13133"
            targetPort: "13133"
    loki:
      serviceName: loki
      image:
        repository: grafana/loki
        tag: 3.7.3
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: ClusterIP
        clusterIP: None
        port: "3100"
        targetPort: "3100"
      volumeResources:
        requests:
          storage: 1Gi
    jaeger:
      serviceName: jaeger
      image:
        repository: jaegertracing/all-in-one
        tag: 1.76.0
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: NodePort
        ports:
          ui:
            name: ui
            port: "16686"
            targetPort: "16686"
          otlpGrpc:
            name: otlp-grpc
            port: "4317"
            targetPort: "4317"
    nodeExporter:
      serviceName: node-exporter
      image:
        repository: prom/node-exporter
        tag: v1.12.0
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: ClusterIP
        clusterIP: None
        port: "9100"
        targetPort: "9100"
    grafana:
      serviceName: grafana
      image:
        repository: grafana/grafana
        tag: 12.4.5
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: NodePort
        port: "3000"
        targetPort: "3000"
      volumeResources:
        requests:
          storage: 1Gi
