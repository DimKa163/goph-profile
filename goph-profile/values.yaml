postgres:
  namespace: "postgres"
  deployment:
    postgres:
      serviceName: "postgres"
      image:
        repository: "postgres"
        tag: "17"
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: NodePort
        clusterIP: None
        port: "5432"
        targetPort: "5432"
      stringData:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: goph
        POSTGRES_DB: goph

      volumeResources:
        requests:
          storage: 1Gi

kafka:
  namespace: kafka
  deployment:
    kafka:
      serviceName: "kafka"
      image:
        repository: "confluentinc/cp-kafka"
        tag: "7.6.1"
        imagePullPolicy: IfNotPresent
      service:
        type: ClusterIP
        clusterIP: ""
        port: "9092"
      stringData:
        KAFKA_BROKER_ID: "1"
        KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
        KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092"
        KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka.kafka.svc.cluster.local:9092"
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT"
        KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    zookeeper:
      serviceName: "zookeeper"
      image:
        repository: "confluentinc/cp-zookeeper"
        tag: "7.6.1"
        imagePullPolicy: IfNotPresent
      service:
        type: ClusterIP
        clusterIP: None
        port: "2181"

minio:
  namespace: minio
  deployment:
    minio:
      serviceName: minio
      image:
        repository: minio/minio
        tag: latest
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: ClusterIP
        clusterIP: None
        ports:
          api:
            port: "9000"
            targetPort: "9000"
          console:
            port: "9001"
            targetPort: "9001"
      stringData:
        MINIO_ROOT_USER: "admin"
        MINIO_ROOT_PASSWORD: "admin12345"
      resources:
        requests:
          memory: 1Gi
        limits:
          memory: 2Gi
      volumeResources:
        requests:
          storage: 5Gi

monitoring:
  namespace: monitoring
  deployment:
    prometheus:
      serviceName: prometheus
      image:
        repository: prom/prometheus
        tag: v3.13.1
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: NodePort
        port: "9090"
        targetPort: "9090"
    otelCollector:
      serviceName: otel-collector
      image:
        repository: otel/opentelemetry-collector
        tag: 0.143.0
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: ClusterIP
        clusterIP: None
        ports:
          otlpGrpc:
            name: otlp-grpc
            port: "4317"
            targetPort: "4317"
          prometheus:
            name: prometheus
            port: "8889"
            targetPort: "8889"
          health:
            name: health
            port: "13133"
            targetPort: "13133"
    loki:
      serviceName: loki
      image:
        repository: grafana/loki
        tag: 3.7.3
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: ClusterIP
        clusterIP: None
        port: "3100"
        targetPort: "3100"
      volumeResources:
        requests:
          storage: 1Gi
    jaeger:
      serviceName: jaeger
      image:
        repository: jaegertracing/all-in-one
        tag: 1.76.0
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: NodePort
        ports:
          ui:
            name: ui
            port: "16686"
            targetPort: "16686"
          otlpGrpc:
            name: otlp-grpc
            port: "4317"
            targetPort: "4317"
    nodeExporter:
      serviceName: node-exporter
      image:
        repository: prom/node-exporter
        tag: v1.12.0
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: ClusterIP
        clusterIP: None
        port: "9100"
        targetPort: "9100"
    grafana:
      serviceName: grafana
      image:
        repository: grafana/grafana
        tag: 12.4.5
        imagePullPolicy: IfNotPresent
      replicas: 1
      service:
        type: NodePort
        port: "3000"
        targetPort: "3000"
      volumeResources:
        requests:
          storage: 1Gi

app:
  deployment:
    server:
      image:
        repository: d1dog/goph-server
        tag: latest
        imagePullPolicy: IfNotPresent
        port: 8080
      resources:
        requests:
          cpu: 100m
      env:
        GOPH_ADDR: ":8080"
        GOPH_DATABASE: "postgres://postgres:goph@postgres.postgres:5432/goph?sslmode=disable"
        GOPH_BUCKET: "goph"
        GOPH_REGION: "eu-east-1"
        GOPH_ENDPOINT: "http://minio.minio:9000"
        GOPH_ACCESS_KEY: "admin"
        GOPH_SECRET_KEY: "admin12345"
        GOPH_USE_SSL: "false"
        GOPH_BROKERS: "kafka.kafka.svc.cluster.local:9092"
        OTEL_SERVICE_NAME: "goph-server"
        OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=development"
        OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.monitoring:4317"
        OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
        OTEL_EXPORTER_OTLP_INSECURE: "true"

      annotations: {}

      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 10
        targetCPUUtilizationPercentage: 80

      service:
        type: ClusterIP
    outbox:
      image:
        repository: d1dog/goph-outbox
        tag: latest
        imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 100m
      env:
        GOPH_DATABASE: "postgres://postgres:goph@postgres.postgres:5432/goph?sslmode=disable"
        GOPH_BROKERS: "kafka.kafka.svc.cluster.local:9092"
        OTEL_SERVICE_NAME: "goph-outbox"
        OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=development"
        OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.monitoring:4317"
        OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
        OTEL_EXPORTER_OTLP_INSECURE: "true"

      annotations: {}

      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 10
        targetCPUUtilizationPercentage: 80
    inbox:
      image:
        repository: d1dog/goph-inbox
        tag: latest
        imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 100m
      env:
        GOPH_DATABASE: "postgres://postgres:goph@postgres.postgres:5432/goph?sslmode=disable"
        GOPH_BUCKET: "goph"
        GOPH_REGION: "eu-east-1"
        GOPH_ENDPOINT: "http://minio.minio:9000"
        GOPH_ACCESS_KEY: "admin"
        GOPH_SECRET_KEY: "admin12345"
        GOPH_USE_SSL: "false"
        GOPH_BROKERS: "kafka.kafka.svc.cluster.local:9092"
        OTEL_SERVICE_NAME: "goph-inbox"
        OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=development"
        OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.monitoring:4317"
        OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
        OTEL_EXPORTER_OTLP_INSECURE: "true"

      annotations: {}

      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 10
        targetCPUUtilizationPercentage: 80

ingress:
  enabled: true
  className: "goph-profile-traefik"
  hosts:
    - host: goph-avatar
      paths:
        - path: /
          pathType: Prefix
          serviceName: "goph-profile-server"
          port: 80
    - host: localhost
      paths:
          - path: /
            pathType: Prefix
            serviceName: "goph-profile-server"
            port: 80
