name: release.yml
on:
  push:
    branches: [ main ]
    tags:
      - "v*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from main"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-server:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-server:latest
          build-args: |
            APP_NAME=server
            APP_VERSION=${{ github.ref_name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-outbox:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-outbox:latest
          build-args: |
            APP_NAME=outbox
            APP_VERSION=${{ github.ref_name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-inbox:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-inbox:latest
          build-args: |
            APP_NAME=inbox
            APP_VERSION=${{ github.ref_name }}
