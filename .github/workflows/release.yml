name: release.yml
on:
  release:
    types: [ published ]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Determine release stability
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "IMAGE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
            echo "CHANNEL_TAG=latest" >> "$GITHUB_ENV"
            echo "Tag ${RELEASE_TAG} (${GITHUB_SHA}) is stable"
          else
            echo "IMAGE_TAG=${RELEASE_TAG}-unstable" >> "$GITHUB_ENV"
            echo "CHANNEL_TAG=unstable" >> "$GITHUB_ENV"
            echo "Tag ${RELEASE_TAG} (${GITHUB_SHA}) is not reachable from main; publishing unstable image"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-server:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-server:${{ env.CHANNEL_TAG }}
          build-args: |
            APP_NAME=server
            APP_VERSION=${{ env.IMAGE_TAG }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-outbox:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-outbox:${{ env.CHANNEL_TAG }}
          build-args: |
            APP_NAME=outbox
            APP_VERSION=${{ env.IMAGE_TAG }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-inbox:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/goph-inbox:${{ env.CHANNEL_TAG }}
          build-args: |
            APP_NAME=inbox
            APP_VERSION=${{ env.IMAGE_TAG }}
